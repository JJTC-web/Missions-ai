{% extends "base.html" %}
{% block title %}Client Portal Login &mdash; MissionOS AI{% endblock %}
{% block content %}
<h1>Client Portal</h1>
<p>Sign in to view your organization's documents and fund development resources.</p>

<form method="post">
  <input type="hidden" name="next" value="{{ next }}">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required>

  <button type="submit" class="button">Sign In</button>
</form>

<p><a href="{{ url_for('portal_forgot_password') }}">Forgot your password?</a></p>
{% endblock %}

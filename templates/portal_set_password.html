{% extends "base.html" %}
{% block title %}Set Your Password &mdash; MissionOS AI{% endblock %}
{% block content %}
<h1>Set Your Password</h1>
<p id="portal-set-password-status">Checking your invite link&hellip;</p>

<form id="portal-set-password-form" style="display:none;">
  <label for="password">New password</label>
  <input type="password" id="password" minlength="8" required>

  <label for="password_confirm">Confirm password</label>
  <input type="password" id="password_confirm" minlength="8" required>

  <p class="error" id="portal-set-password-error" style="display:none;"></p>

  <button type="submit" class="button">Set Password &amp; Sign In</button>
</form>

<form id="portal-login-submit" method="post" action="{{ url_for('portal_login') }}" style="display:none;">
  <input type="hidden" name="email" id="portal-login-email">
  <input type="hidden" name="password" id="portal-login-password">
</form>

<script>
(function () {
  var SUPABASE_URL = {{ supabase_url | tojson }};
  var SUPABASE_ANON_KEY = {{ supabase_anon_key | tojson }};
  var statusEl = document.getElementById("portal-set-password-status");
  var formEl = document.getElementById("portal-set-password-form");
  var errorEl = document.getElementById("portal-set-password-error");

  var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var accessToken = params.get("access_token");
  var userEmail = null;

  if (!accessToken || !SUPABASE_URL || !SUPABASE_ANON_KEY) {
    statusEl.textContent = "This invite link is invalid or has expired. Ask your MissionOS AI contact for a new one.";
    return;
  }

  fetch(SUPABASE_URL + "/auth/v1/user", {
    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + accessToken }
  })
    .then(function (resp) {
      if (!resp.ok) { throw new Error("Could not verify this invite link."); }
      return resp.json();
    })
    .then(function (user) {
      userEmail = user.email;
      statusEl.textContent = "Setting a password for " + userEmail + ":";
      formEl.style.display = "block";
    })
    .catch(function (e) {
      statusEl.textContent = e.message || "This invite link is invalid or has expired.";
    });

  formEl.addEventListener("submit", function (evt) {
    evt.preventDefault();
    errorEl.style.display = "none";
    var password = document.getElementById("password").value;
    var confirmPassword = document.getElementById("password_confirm").value;

    if (password.length < 8) {
      errorEl.textContent = "Password must be at least 8 characters.";
      errorEl.style.display = "block";
      return;
    }
    if (password !== confirmPassword) {
      errorEl.textContent = "Passwords don't match.";
      errorEl.style.display = "block";
      return;
    }

    fetch(SUPABASE_URL + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: password })
    })
      .then(function (resp) {
        if (!resp.ok) {
          return resp.json().then(function (body) {
            throw new Error(body.msg || "Could not set password.");
          });
        }
        document.getElementById("portal-login-email").value = userEmail;
        document.getElementById("portal-login-password").value = password;
        document.getElementById("portal-login-submit").submit();
      })
      .catch(function (e) {
        errorEl.textContent = e.message || "Could not set password.";
        errorEl.style.display = "block";
      });
  });
})();
</script>
{% endblock %}

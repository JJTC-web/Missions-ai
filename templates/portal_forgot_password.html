{% extends "base.html" %}
{% block title %}Reset Your Password &mdash; MissionOS AI{% endblock %}
{% block content %}
<h1>Reset Your Password</h1>
<p>Enter the email your Client Portal account uses, and we'll send you a link to set a new password.</p>

<form method="post">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <button type="submit" class="button">Send Reset Link</button>
</form>

<p><a href="{{ url_for('portal_login') }}">Back to sign in</a></p>
{% endblock %}
